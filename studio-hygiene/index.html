plate-columns:repeat(4,1fr);gap:10px}.story{border-radius:13px;overflow:hidden;padding:0}.story .visual{height:120px;border-radius:0;margin:0}.story small{color:var(--pink);font-size:9px;letter-spacing:.12em;display:block;padding:9px 10px 2px}.story b{font-size:12px;display:block;padding:0 10px 10px}.preview{border:1px solid var(--line);background:#fff;padding:17px;border-radius:17px}.storypreview{min-height:370px;border-radius:13px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#fff,#f5ecea 50%,#d8c5c0)}.storypreview h2{font:500 33px/1.04 'Playfair Display';margin:0}.photo{height:126px;border-radius:10px;background:linear-gradient(135deg,#ba978c,#f3dfda,#997568)}.bottom{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);background:#181618;color:white;border-radius:99px;padding:12px 17px;font-size:13px;transition:.2s}.toast.show{transform:translate(-50%,0)}@media(max-width:720px){.app{padding:0 0 75px}.top{padding:0 16px;position:sticky;top:0;background:#ffffffed;z-index:2}.top p{display:none}.layout{display:block;padding:0}.side{display:none}.main{padding:21px 16px 0}.title{font-size:30px}.hero{padding:18px;grid-template-columns:1fr 62px}.hero h2{font-size:24px}.spark{font-size:26px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:11px;min-height:130px}.visual{height:57px}.storygrid{grid-template-columns:repeat(2,1fr);gap:8px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:67px;background:#fffffff0;border-top:1px solid var(--line);justify-content:space-around;z-index:3}.bottom button{border:0;background:none;font:10px inherit;color:#777;display:grid;gap:3px;justify-items:center;padding:7px}.bottom b{font-size:17px;font-weight:400}.bottom button.active{color:var(--pink)}}</style></head><body><div class="app"><header class="top"><div class="logo">NDL OS</div><p>Créer · Partager · Fidéliser · Développer</p><button class="avatar">T</button></header><div class="layout"><aside class="side"><button class="active" data-go="today"><i class="ico"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg></i>Aujourd’hui</button><button data-go="create"><i class="ico"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></i>Créer</button><button data-go="content"><i class="ico"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg></i>Contenus</button><button data-go="poses"><i class="ico"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="8" cy="8" r="1"/></svg></i>Mes poses</button><button data-go="presence"><i class="ico"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.9-8.6a5.5 5.5 0 0 0-.1-7.8z"/></svg></i>Marque & clientes</button></aside><main id="main" class="main"></main></div></div><nav class="bottom"><button class="active" data-go="today"><b><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10H3z"/></svg></b>Aujourd’hui</button><button data-go="create"><b><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></b>Créer</button><button data-go="content"><b><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></b>Contenus</button><button data-go="poses"><b><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg></b>Poses</button><button data-go="presence"><b><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.9-8.6a5.5 5.5 0 0 0-.1-7.8z"/></svg></b>Marque</button></nav><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s);let page='today',sub='';const links=(a)=>`<div class="grid">${a.map(x=>`<button class="card" data-sub="${x[0]}"><div class="visual ${x[3]||''}"></div><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</div>`;const go=x=>{if(x==='create'){location.href='/studio-hygiene/creator/';return}page=x;sub='';render()};
function render(){let h='';if(page==='today')h=`<p class="eyebrow">Workspace</p><h1 class="title">Bonjour, Tania.</h1><p class="lede">Tu pars d’un objectif, pas d’une page au hasard.</p><div class="hero"><div><h2>Une pose aujourd’hui ?<br><i>Transforme-la en contenu.</i></h2><p>Choisis un chemin, NDL OS garde le fil.</p></div><div class="spark">＋</div></div><p class="label">Les vrais raccourcis</p>${links([['film','Filmer pendant la pose','Shot-list, cadre, Reel.','pink'],['storypack','Story System','Présence → réservation.','dark'],['repousse','Preuve de tenue','Résultats à 2–4 semaines.','green']])}`;
if(page==='create')h=`<p class="eyebrow">Créer</p><h1 class="title">Quel est ton objectif ?</h1><p class="lede">Une seule entrée. Le bon parcours ensuite.</p>${links([['film','Pendant un rendez-vous','Filmer sans casser ton flow.','pink'],['newcontent','Partir d’un template','Story, post, carrousel, Reel.',''],['resultcreate','Partir d’un résultat','Photo, preuve, avant/après.','dark'],['copy','Trouver les mots','Hooks, légendes, CTA.','green']])}`;
if(page==='content')h=`<p class="eyebrow">Contenus</p><h1 class="title">Une bibliothèque par intention.</h1><p class="lede">Attirer, rassurer, convertir, fidéliser. Voilà le rangement logique.</p><div class="pills"><button class="active">Tout</button><button>Attirer</button><button>Rassurer</button><button>Convertir</button><button>Fidéliser</button></div>${links([['storypack','Story System','12 stories organisées par rôle.','pink'],['social','Réseaux sociaux','Posts, carrousels, covers.',''],['trust','Confiance studio','Hygiène, tarifs, règles, avis.','green'],['offers','Offres & fidélité','Carte, promos, rappels.','dark'],['copy','Hooks & légendes','Textes utiles à adapter.','pink'],['newcontent','Créer un format','Depuis le même contenu.','']])}`;
if(page==='poses')h=`<p class="eyebrow">Mes poses</p><h1 class="title">Le travail qui prouve tout.</h1><p class="lede">Résultats, avant/après et repousses restent ensemble.</p><div class="pills"><button class="active" data-sub="gallery">Résultats</button><button data-sub="beforeafter">Avant / Après</button><button data-sub="repousse">Repousses</button></div>${links([['gallery','Galerie résultats','Organise tes plus belles poses.','pink'],['beforeafter','Avant / Après','Montre la transformation.',''],['repousse','Preuves de tenue','Rassure avec du concret.','dark']])}`;
if(page==='presence')h=`<p class="eyebrow">Marque & clientes</p><h1 class="title">Tout ce que voit ta cliente.</h1><p class="lede">Ton site, tes règles et ton identité doivent se suivre, pas se disperser.</p>${links([['site','Parcours du site','Accueil → portfolio → réserver.','pink'],['trust','Confiance','Tarifs, règles, avis.',''],['offers','Fidélité','Carte, offres, rappels.','dark'],['brand','Identité','Logo, signature, déclinaisons.','green'],['client','Espace cliente','Réserver, revenir, fidéliser.','pink']])}`;
if(sub==='film')h=`<button class="back" data-back="${page}">← Retour</button><p class="eyebrow">Créer pendant la pose</p><h1 class="title">Filme sans casser le rendez-vous.</h1><p class="lede">Planifier → cadrer → filmer → monter. C’est un seul flux.</p>${links([['shot','1. Shot-list','Ce que tu dois capter.','pink'],['camera','2. Cadre live','Ne rate pas tes mains.','dark'],['structure','3. Structure Reel','Accroche, process, résultat.',''],['cover','4. Cover','Fais cliquer au premier regard.','green']])}`;
if(sub==='shot')h=`<button class="back" data-sub="film">← Filmer</button><h1 class="title">Shot-list pose complète</h1><p class="lede">Coche pendant le rendez-vous.</p><div class="rows">${['Préparation russe','Pose capsule / chablon','Application matière','Limage','French / Nail art','Top coat'].map((x,i)=>`<label class="row"><input type="checkbox" ${i===0?'checked':''} style="accent-color:var(--pink)"><b>${i+1}. ${x}</b></label>`).join('')}</div><div class="notice" style="margin-top:13px">Un plan large, un macro, un profil : c’est suffisant.</div>`;
if(sub==='camera')h=`<button class="back" data-sub="film">← Filmer</button><h1 class="title">Cadre live</h1><p class="lede">Il sert juste à sécuriser le plan.</p><div class="preview"><div class="storypreview" style="background:linear-gradient(135deg,#171717,#574c49,#c4a097);color:white"><small>9:16 · 60 s · 4K</small><div style="height:220px;border:2px dashed #ffffffb8;border-radius:14px;display:grid;place-items:center;text-align:center">Garde tes mains<br>dans cette zone</div><button class="primary" data-toast="Enregistrement prêt">Lancer l’enregistrement</button></div></div>`;
if(sub==='structure')h=`<button class="back" data-sub="film">← Filmer</button><h1 class="title">Structure ton Reel</h1><p class="lede">30 secondes, trois temps.</p><div class="rows">${[['Accroche · 0–3 sec','Stopper le scroll.'],['Processus · 3–20 sec','Montrer les étapes clés.'],['Résultat · 20–30 sec','Faire envie.']].map(x=>`<div class="row"><div><b>${x[0]}</b><span>${x[1]}</span></div><i class="arrow">☷</i></div>`).join('')}</div>`;
if(sub==='cover')h=`<button class="back" data-sub="film">← Filmer</button><h1 class="title">Choisis ta cover</h1><p class="lede">La cover donne envie de regarder. Elle ne raconte pas tout.</p><div class="preview"><div class="storypreview" style="background:linear-gradient(135deg,#171717,#897a73,#e9c7bf);color:white"><small>NDL.</small><h2>POSE<br>COMPLÈTE</h2><small>Un résultat qui mérite d’être vu.</small></div><button class="primary" data-toast="Cover sélectionnée">Utiliser cette cover</button></div>`;
if(sub==='storypack')h=`<button class="back" data-back="${page}">← Retour</button><p class="eyebrow">Pack contenu</p><h1 class="title">Story System</h1><p class="lede">Elles sont classées par rôle, plus dans un mur sans sens.</p><div class="pills"><button class="active">Attirer</button><button>Rassurer</button><button>Convertir</button><button>Fidéliser</button></div><div class="storygrid">${['Hero','Portfolio','Avant / Après','Avis cliente','Tarifs','Disponibilités','Dernière minute','Rappels','Nouveau set','Fidélité','CTA réservation','Merci'].map((x,i)=>`<button class="story" data-sub="story"><div class="visual ${i%3===0?'pink':i%3===1?'dark':''}"></div><small>${i<3?'ATTIRER':i<6?'RASSURER':i<9?'CONVERTIR':'FIDÉLISER'}</small><b>${x}</b></button>`).join('')}</div><button class="primary" data-sub="newcontent">Personnaliser le pack</button>`;
if(sub==='story')h=`<button class="back" data-sub="storypack">← Toutes les stories</button><h1 class="title">Aperçu story</h1><p class="lede">Le template est un point de départ, pas une page isolée.</p><div class="preview"><div class="storypreview"><small>NDL · VOTRE NOM</small><h2>Plus qu’une pose,<br>une attention.</h2><div class="photo"></div><button class="primary" data-sub="newcontent">Utiliser cette story →</button></div></div>`;
if(sub==='newcontent'||sub==='social')h=`<button class="back" data-back="${page}">← Retour</button><h1 class="title">Choisis ton format.</h1><p class="lede">Le contenu est le même. Tu choisis seulement sa sortie.</p>${links([['resultcreate','Photo simple','Une image forte.','pink'],['resultcreate','Carrousel','Raconter en plusieurs slides.',''],['story','Story','Rapide et verticale.','green'],['structure','Reel','Processus ou transformation.','dark']])}`;
if(sub==='resultcreate'||sub==='gallery')h=`<button class="back" data-back="${page}">← Retour</button><h1 class="title">Mes résultats</h1><p class="lede">Une galerie qui sert à créer du contenu.</p><div class="grid">${Array.from({length:9},(_,i)=>`<button class="card" data-sub="repousse" style="min-height:120px;padding:8px"><div class="visual ${i%3===0?'pink':''}" style="height:88px;margin:0"></div></button>`).join('')}</div><button class="primary" data-sub="newcontent">Créer avec ce résultat</button>`;
if(sub==='beforeafter'||sub==='repousse')h=`<button class="back" data-back="poses">← Mes poses</button><h1 class="title">${sub==='beforeafter'?'Avant / Après':'Preuve de tenue'}</h1><p class="lede">${sub==='beforeafter'?'La transformation se raconte en deux photos.':'La tenue se prouve à 2, 3 ou 4 semaines.'}</p><div class="preview"><div class="storypreview"><small>UNE TENUE QUI FAIT LA DIFFÉRENCE</small><h2>${sub==='beforeafter'?'Même mains. Nouvelle énergie.':'3 semaines plus tard'}</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="photo"></div><div class="photo"></div></div><small>Tenue solide · Apex stable · Repousse nette</small></div><button class="primary" data-sub="newcontent">Créer ce contenu</button></div>`;
if(sub==='trust')h=`<button class="back" data-back="${page}">← Retour</button><h1 class="title">Confiance studio</h1><p class="lede">Ce que la cliente doit comprendre avant de réserver.</p>${links([['prices','Tarifs transparents','Prix sans flou.','pink'],['rules','Règles claires','Un cadre qui protège tout le monde.',''],['proof','Avis clientes','Preuve sociale.','dark'],['site','Hygiène & studio','Sérieux et professionnalisme.','green']])}`;
if(sub==='offers')h=`<button class="back" data-back="${page}">← Retour</button><h1 class="title">Fidélité & offres</h1><p class="lede">Faire revenir sans casser ton prix.</p>${links([['client','Carte fidélité','10 passages, une récompense.','pink'],['client','Offre spéciale','À utiliser avec intention.','']])}`;
if(sub==='copy')h=`<button class="back" data-back="${page}">← Retour</button><h1 class="title">Hooks & légendes</h1><p class="lede">Du texte prêt à adapter.</p><div class="rows">${['Cette transformation en 30 secondes… tu valides ?','La preuve qu’une bonne préparation change tout.','Du cuticule au gloss ✨','Team nude ou couleur ?','Le détail qui fait la différence : l’apex ♡'].map(x=>`<button class="row" data-toast="Texte copié"><b>${x}</b><i class="arrow">⧉</i></button>`).join('')}</div>`;
if(sub==='site')h=`<button class="back" data-back="presence">← Marque & clientes</button><h1 class="title">Un parcours client complet.</h1><p class="lede">Les pages sont là pour faire avancer la cliente, dans cet ordre.</p><div class="rows">${[['Accueil','Donne l’énergie et dirige.'],['Portfolio','Prouve ton niveau.'],['Prestations & tarifs','Clarifie le choix.'],['Règles','Cadre l’expérience.'],['À propos','Ajoute confiance.'],['Réservation','Transforme l’intérêt en créneau.']].map(x=>`<button class="row" data-toast="Page ajoutée"><div><b>${x[0]}</b><span>${x[1]}</span></div><i class="arrow">›</i></button>`).join('')}</div>`;
if(['prices','rules','proof'].includes(sub))h=`<button class="back" data-back="presence">← Marque & clientes</button><h1 class="title">${sub==='prices'?'Tarifs simples.':sub==='rules'?'Règles du studio.':'Ce que disent tes clientes.'}</h1><p class="lede">${sub==='prices'?'La cliente comprend avant de t’écrire.':sub==='rules'?'Un cadre clair, sans froideur.':'Le meilleur contenu de conversion.'}</p><div class="panel">${sub==='prices'?[['Pose classique','50 €'],['Gainage','55 €'],['Semi-permanent','40 €'],['Dépose','20 €']].map(x=>`<div class="row" style="padding:12px 0"><b>${x[0]}</b><b style="margin-left:auto">${x[1]}</b></div>`).join(''):sub==='rules'?['Arriver à l’heure','Prévenir 24h avant','Respect & bienveillance','Paiement'].map(x=>`<div class="row"><b>${x}</b></div>`).join(''):`<h2 style="font:500 24px/1.2 'Playfair Display';margin:0">“ Des ongles parfaits, un accueil incroyable et une vraie attention aux détails. ”</h2><p style="color:var(--muted)">Camille D. · ★★★★★</p>`}</div><button class="primary" data-toast="Ajouté">Utiliser</button>`;
if(sub==='brand')h=`<button class="back" data-back="presence">← Marque & clientes</button><h1 class="title">Identité de marque</h1><p class="lede">Les quatre déclinaisons dont tu as vraiment besoin.</p><div class="grid">${['NDL','NDL NAIL ARTIST','Ⓝ','NDL OS'].map(x=>`<div class="panel" style="height:140px;display:grid;place-items:center;font:500 27px 'Playfair Display';text-align:center">${x}</div>`).join('')}</div>`;
if(sub==='client')h=`<button class="back" data-back="presence">← Marque & clientes</button><h1 class="title">Espace cliente</h1><p class="lede">Après la réservation, elle retrouve tout ici.</p><div class="preview"><div class="storypreview" style="background:white"><small>NDL OS</small><h2>Bonjour ♡<br>Prête pour ta prochaine pose ?</h2>${links([['site','Réserver',''],['poses','Mes rendez-vous',''],['offers','Carte fidélité',''],['gallery','Mon portfolio','']])}</div></div>`;
$('#main').innerHTML=h;document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));document.querySelectorAll('[data-sub]').forEach(e=>e.onclick=()=>{if(e.dataset.sub==='storypack'){location.href='/studio-hygiene/content-library/';return}if(e.dataset.sub==='film'){location.href='/studio-hygiene/nail-cam/';return}sub=e.dataset.sub;render()});document.querySelectorAll('[data-back]').forEach(e=>e.onclick=()=>{page=e.dataset.back;sub='';render()});document.querySelectorAll('[data-toast]').forEach(e=>e.onclick=()=>toast(e.dataset.toast));document.querySelectorAll('[data-go]').forEach(e=>e.classList.toggle('active',e.dataset.go===page))}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}render();</script></body></html>
